name: Build Ejazati APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip Ejazati_Android_Mobile_Build.zip
          cd EmployeeLeaveApp
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ejazati-apk
          path: EmployeeLeaveApp/app/build/outputs/apk/debug/*.apk
